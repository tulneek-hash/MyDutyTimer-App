# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Голосовые оповещения
    description                           : Приложение вслух предупреждает об обходах, докладах и перерывах. Не нужно смотреть на экран.
    fontawesome_icon_name                 : volume-up
    
  - title                                 : Два таймера
    description                           : Оранжевый — время до конца текущего обхода. Зелёный — время до следующего события.
    fontawesome_icon_name                 : clock

  - title                                 : Ночные смены
    description                           : Корректная работа с графиками, переходящими через полночь (20:00–08:00).
    fontawesome_icon_name                 : moon

  - title                                 : Будильник для важных событий
    description                           : Критически важные задачи не дадут проспать. Звуковой сигнал срабатывает даже в фоне.
    fontawesome_icon_name                 : bell

  - title                                 : Умные перерывы
    description                           : Во время отдыха уведомления не приходят. Обходы автоматически сдвигаются.
    fontawesome_icon_name                 : coffee
  
  - title                                 : Поддержка смарт-часов
    description                           : Уведомления дублируются на Galaxy Watch и WearOS.
    fontawesome_icon_name                 : watch

  - title                                 : Работает в фоне
    description                           : Экран выключен, приложение свёрнуто — события приходят вовремя.
    fontawesome_icon_name                 : power-off

  - title                                 : Бесплатно
    description                           : Без подписок и скрытых платежей. Один просмотр рекламы — и смена запущена.
    fontawesome_icon_name                 : check-circle



